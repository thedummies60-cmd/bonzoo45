<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonzoo4.5 AI</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface-hover: #252533;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --text-muted: #8888a0;
    --primary: #7c5cff;
    --primary-glow: rgba(124, 92, 255, 0.3);
    --fast-color: #4ade80;
    --think-color: #fbbf24;
    --thinking-bg: #18182a;
    --thinking-border: #3a3a5a;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s;
  }
  
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  
  .sidebar-header h2 { font-size: 18px; font-weight: 700; }
  
  .new-chat-btn {
    margin: 15px 20px;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
  }
  
  .new-chat-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px var(--primary-glow);
  }
  
  .history-list { flex: 1; overflow-y: auto; padding: 10px; }
  
  .history-item {
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
    transition: all 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  .history-item:hover, .history-item.active {
    background: var(--surface-hover);
    color: var(--text);
  }
  
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    gap: 12px;
  }
  
  .header-left { display: flex; align-items: center; gap: 12px; }
  
  .model-badge {
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    color: white;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  
  /* Mode toggle */
  .mode-toggle {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 3px;
  }
  
  .mode-btn {
    padding: 6px 14px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  
  .mode-btn:hover { color: var(--text); }
  
  .mode-btn.active-fast {
    background: var(--fast-color);
    color: #0f0f14;
  }
  
  .mode-btn.active-think {
    background: var(--think-color);
    color: #0f0f14;
  }
  
  .mode-status {
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 8px;
  }
  
  .menu-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
  }
  
  .messages { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
  
  .message {
    max-width: 800px;
    margin: 0 auto 24px;
    display: flex;
    gap: 14px;
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 14px;
  }
  
  .avatar.user { background: linear-gradient(135deg, #7c5cff, #a78bfa); color: white; }
  .avatar.ai { background: linear-gradient(135deg, #2a2a3a, #3a3a5a); color: var(--primary); }
  
  .message-content { flex: 1; min-width: 0; }
  
  .message-author {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .message-mode-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  
  .tag-fast { background: rgba(74, 222, 128, 0.15); color: var(--fast-color); }
  .tag-think { background: rgba(251, 191, 36, 0.15); color: var(--think-color); }
  
  .message-time { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  
  .message-body { line-height: 1.7; color: var(--text); word-wrap: break-word; }
  .message-body p { margin-bottom: 10px; }
  .message-body p:last-child { margin-bottom: 0; }
  
  .message-body pre {
    background: #0d0d12;
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 10px;
    overflow-x: auto;
    margin: 12px 0;
  }
  
  .message-body code { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
  
  .message-body :not(pre) > code {
    background: var(--surface-hover);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  
  .message-body ul, .message-body ol { margin: 10px 0 10px 24px; }
  .message-body li { margin-bottom: 4px; }
  .message-body h1, .message-body h2, .message-body h3 { margin: 16px 0 8px; }
  .message-body blockquote {
    border-left: 3px solid var(--primary);
    padding-left: 14px;
    margin: 10px 0;
    color: var(--text-muted);
  }
  .message-body a { color: var(--primary); text-decoration: none; }
  .message-body a:hover { text-decoration: underline; }
  
  .thinking-block {
    background: var(--thinking-bg);
    border: 1px solid var(--thinking-border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  
  .thinking-header {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  
  .thinking-header:hover { background: var(--surface-hover); color: var(--text); }
  
  .thinking-toggle { transition: transform 0.2s; font-size: 10px; }
  .thinking-block.open .thinking-toggle { transform: rotate(90deg); }
  
  .thinking-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
  .thinking-block.open .thinking-body { max-height: 2000px; }
  
  .thinking-content {
    padding: 0 14px 14px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    font-style: italic;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  
  .thinking-active { color: var(--think-color); font-style: normal; }
  
  .message-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  
  .message:hover .message-actions { opacity: 1; }
  
  .action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  
  .action-btn:hover { background: var(--surface-hover); color: var(--text); }
  
  .typing { display: flex; gap: 4px; padding: 12px 0; }
  
  .typing-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  
  .welcome { text-align: center; padding: 60px 24px; max-width: 700px; margin: 0 auto; }
  
  .welcome-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    border-radius: 20px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 24px;
    box-shadow: 0 8px 30px var(--primary-glow);
  }
  
  .welcome h1 {
    font-size: 28px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #fff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .welcome p { color: var(--text-muted); margin-bottom: 30px; }
  
  .mode-explain {
    display: flex;
    gap: 12px;
    max-width: 500px;
    margin: 0 auto 30px;
    font-size: 13px;
    color: var(--text-muted);
  }
  
  .mode-explain-item {
    flex: 1;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  
  .mode-explain-item strong { color: var(--text); display: block; margin-bottom: 4px; }
  
  .suggestions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  
  .suggestion {
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    color: var(--text);
    font-size: 13px;
  }
  
  .suggestion:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  
  .suggestion-title { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  
  .input-area {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  
  .input-wrapper {
    max-width: 800px;
    margin: 0 auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: flex-end;
    padding: 8px;
    transition: all 0.2s;
  }
  
  .input-wrapper:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }
  
  .input-wrapper textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    padding: 8px 12px;
    resize: none;
    outline: none;
    max-height: 200px;
    line-height: 1.5;
  }
  
  .send-btn {
    background: var(--primary);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  
  .send-btn:hover:not(:disabled) { background: #6a4ef0; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }
  
  .input-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 10px; }
  
  .error-banner {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.3);
    color: #f87171;
    padding: 12px 16px;
    border-radius: 10px;
    margin: 10px auto;
    max-width: 800px;
    font-size: 13px;
  }
  
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  
  @media (max-width: 768px) {
    .sidebar { position: fixed; height: 100%; z-index: 100; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .menu-btn { display: block; }
    .messages { padding: 16px; }
    .input-area { padding: 12px; }
    .chat-header { padding: 12px 16px; flex-wrap: wrap; }
    .mode-toggle { order: 3; width: 100%; margin-top: 8px; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Bonzoo4.5</h2>
  </div>
  <button class="new-chat-btn" onclick="newChat()">+ Nieuw gesprek</button>
  <div class="history-list" id="historyList"></div>
</aside>

<main class="main">
  <header class="chat-header">
    <div class="header-left">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button>
      <div class="model-badge">Bonzoo4.5</div>
    </div>
    
    <div class="mode-toggle">
      <button class="mode-btn active-fast" id="btnFast" onclick="setMode('fast')">Snel</button>
      <button class="mode-btn" id="btnThink" onclick="setMode('think')">Denken</button>
    </div>
    
    <div class="mode-status" id="modeStatus">Snelle modus actief</div>
  </header>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="userInput" placeholder="Stuur een bericht aan Bonzoo4.5..." rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <div class="input-hint">Enter om te versturen, Shift+Enter voor nieuwe regel</div>
  </div>
</main>

<script>
const API_KEY = "sk-f7a145d2164544ab869afe921fab3dc6";
const API_URL = "https://openrouter.ai/api/v1/chat/completions";

// Twee modellen
const MODELS = {
  fast: "deepseek-chat",      // Snel, geen thinking
  think: "deepseek-reasoner"  // Langzamer, met thinking/reasoning
};

// Huidige modus (opgeslagen in localStorage)
let currentMode = localStorage.getItem('bonzoo_mode') || 'fast';

// CORS proxies - probeert ze allemaal tot er een werkt
const PROXIES = [
  url => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://thingproxy.freeboard.io/fetch/" + url,
  url => "https://corsproxy.io/?" + encodeURIComponent(url),
  url => "https://cors.eu.org/" + url,
  url => "https://proxy.cors.sh/" + url
];

let conversations = JSON.parse(localStorage.getItem('chats') || '{}');
let currentId = null;
let isStreaming = false;

marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

// Mode wisselen
function setMode(mode) {
  currentMode = mode;
  localStorage.setItem('bonzoo_mode', mode);
  updateModeUI();
}

function updateModeUI() {
  const btnFast = document.getElementById('btnFast');
  const btnThink = document.getElementById('btnThink');
  const status = document.getElementById('modeStatus');
  
  btnFast.className = 'mode-btn' + (currentMode === 'fast' ? ' active-fast' : '');
  btnThink.className = 'mode-btn' + (currentMode === 'think' ? ' active-think' : '');
  
  if (currentMode === 'fast') {
    status.textContent = 'Snelle modus - direct antwoord';
    status.style.color = 'var(--fast-color)';
  } else {
    status.textContent = 'Denk-modus - beter doordacht antwoord (langzamer)';
    status.style.color = 'var(--think-color)';
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
}

function renderThinking(thinkingContent, isActive, index) {
  if (!thinkingContent && !isActive) return '';
  const id = 'thinking-' + index;
  const statusText = isActive ? 'Aan het denken...' : 'Bekijk denkproces';
  return '<div class="thinking-block ' + (isActive ? 'open' : '') + '" id="' + id + '">' +
    '<div class="thinking-header" onclick="toggleThinking(\'' + id + '\')">' +
      '<span class="' + (isActive ? 'thinking-active' : '') + '">' + statusText + '</span>' +
      '<span class="thinking-toggle">&gt;</span>' +
    '</div>' +
    '<div class="thinking-body"><div class="thinking-content">' + escapeHtml(thinkingContent) + '</div></div></div>';
}

function toggleThinking(id) {
  document.getElementById(id)?.classList.toggle('open');
}

function renderMessages() {
  const container = document.getElementById('messages');
  const conv = conversations[currentId];
  
  if (!conv || conv.messages.length === 0) {
    container.innerHTML = '<div class="welcome">' +
      '<div class="welcome-icon">B</div>' +
      '<h1>Welkom bij Bonzoo4.5</h1>' +
      '<p>Kies een modus en stel je vraag.</p>' +
      '<div class="mode-explain">' +
        '<div class="mode-explain-item"><strong style="color:var(--fast-color)">Snel</strong>Directe antwoorden voor eenvoudige vragen</div>' +
        '<div class="mode-explain-item"><strong style="color:var(--think-color)">Denken</strong>Beter doordachte antwoorden voor complexe vragen</div>' +
      '</div>' +
      '<div class="suggestions">' +
        '<div class="suggestion" onclick="useSuggestion(this)"><div class="suggestion-title">Leg iets uit</div><div>Leg kwantumcomputing simpel uit</div></div>' +
        '<div class="suggestion" onclick="useSuggestion(this)"><div class="suggestion-title">Schrijf iets</div><div>Schrijf een gedicht over de oceaan</div></div>' +
        '<div class="suggestion" onclick="useSuggestion(this)"><div class="suggestion-title">Help met code</div><div>Debug een JavaScript functie</div></div>' +
        '<div class="suggestion" onclick="useSuggestion(this)"><div class="suggestion-title">Creatief</div><div>Brainstorm ideeën voor een sci-fi verhaal</div></div>' +
      '</div></div>';
    return;
  }
  
  container.innerHTML = conv.messages.map((msg, i) => renderMessage(msg, i)).join('');
  container.scrollTop = container.scrollHeight;
}

function renderMessage(msg, index) {
  const time = new Date(msg.time).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const isUser = msg.role === 'user';
  const parsed = isUser ? escapeHtml(msg.content) : marked.parse(msg.content || '');
  const thinkingHtml = !isUser ? renderThinking(msg.thinking || '', false, index) : '';
  
  // Mode tag alleen voor AI berichten
  let modeTag = '';
  if (!isUser && msg.mode) {
    if (msg.mode === 'fast') {
      modeTag = '<span class="message-mode-tag tag-fast">Snel</span>';
    } else {
      modeTag = '<span class="message-mode-tag tag-think">Denken</span>';
    }
  }
  
  return '<div class="message">' +
    '<div class="avatar ' + (isUser ? 'user' : 'ai') + '">' + (isUser ? 'J' : 'B') + '</div>' +
    '<div class="message-content">' +
      '<div class="message-author">' + (isUser ? 'Jij' : 'Bonzoo4.5') + modeTag + '<span class="message-time">' + time + '</span></div>' +
      thinkingHtml +
      '<div class="message-body">' + parsed + '</div>' +
      '<div class="message-actions">' +
        '<button class="action-btn" onclick="copyMsg(' + index + ')">Kopieer</button>' +
        (!isUser ? '<button class="action-btn" onclick="regenerate(' + index + ')">Opnieuw</button>' : '') +
      '</div></div></div>';
}

function useSuggestion(el) {
  document.getElementById('userInput').value = el.querySelector('div:last-child').textContent;
  sendMessage();
}

function handleKey(e) {
  const ta = e.target;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function newChat() {
  currentId = Date.now().toString();
  conversations[currentId] = { id: currentId, title: 'Nieuw gesprek', messages: [] };
  saveChats();
  renderHistory();
  renderMessages();
}

function loadChat(id) {
  currentId = id;
  renderHistory();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const items = Object.values(conversations).sort((a,b) => b.id - a.id);
  list.innerHTML = items.map(c => 
    '<div class="history-item ' + (c.id === currentId ? 'active' : '') + '" onclick="loadChat(\'' + c.id + '\')">' + escapeHtml(c.title) + '</div>'
  ).join('');
}

function saveChats() {
  localStorage.setItem('chats', JSON.stringify(conversations));
}

function copyMsg(index) {
  navigator.clipboard.writeText(conversations[currentId].messages[index].content || '');
}

async function regenerate(index) {
  if (isStreaming) return;
  conversations[currentId].messages = conversations[currentId].messages.slice(0, index);
  saveChats();
  renderMessages();
  await streamResponse();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text || isStreaming) return;
  
  if (!currentId) newChat();
  
  const conv = conversations[currentId];
  conv.messages.push({ role: 'user', content: text, time: Date.now() });
  
  if (conv.messages.length === 1) {
    conv.title = text.slice(0, 40) + (text.length > 40 ? '...' : '');
  }
  
  input.value = '';
  input.style.height = 'auto';
  saveChats();
  renderHistory();
  renderMessages();
  
  await streamResponse();
}

async function fetchWithProxy(url, options) {
  let lastError = null;
  
  for (const proxyFn of PROXIES) {
    try {
      const proxyUrl = proxyFn(url);
      const res = await fetch(proxyUrl, options);
      if (res.ok) return res;
      lastError = new Error('HTTP ' + res.status);
    } catch (err) {
      lastError = err;
    }
  }
  
  throw lastError || new Error('Alle proxies gefaald');
}

async function streamResponse() {
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;
  
  const conv = conversations[currentId];
  const container = document.getElementById('messages');
  
  const typingEl = document.createElement('div');
  typingEl.className = 'message';
  typingEl.innerHTML = '<div class="avatar ai">B</div><div class="message-content"><div class="message-author">Bonzoo4.5</div><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  container.appendChild(typingEl);
  container.scrollTop = container.scrollHeight;
  
  const mode = currentMode;
  
  try {
    const apiMessages = conv.messages.map(m => ({ role: m.role, content: m.content || '' }));
    
    const res = await fetchWithProxy(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODELS[mode],
        messages: apiMessages,
        stream: true
      })
    });
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let aiContent = '';
    let thinkingContent = '';
    let buffer = '';
    
    typingEl.remove();
    const aiMsg = { role: 'assistant', content: '', thinking: '', mode: mode, time: Date.now() };
    conv.messages.push(aiMsg);
    
    const msgIndex = conv.messages.length - 1;
    
    const msgEl = document.createElement('div');
    msgEl.className = 'message';
    const modeTag = mode === 'fast' ? '<span class="message-mode-tag tag-fast">Snel</span>' : '<span class="message-mode-tag tag-think">Denken</span>';
    msgEl.innerHTML = '<div class="avatar ai">B</div><div class="message-content"><div class="message-author">Bonzoo4.5' + modeTag + '<span class="message-time">' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) + '</span></div><div id="thinking-container"></div><div class="message-body" id="streaming-body"></div></div>';
    container.appendChild(msgEl);
    
    const thinkingContainer = document.getElementById('thinking-container');
    const bodyEl = document.getElementById('streaming-body');
    let thinkingDone = false;
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const data = trimmed.slice(5).trim();
        if (data === '[DONE]') break;
        
        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta || {};
          
          // Thinking content (alleen in denken-modus)
          if (delta.reasoning_content) {
            thinkingContent += delta.reasoning_content;
            aiMsg.thinking = thinkingContent;
            thinkingContainer.innerHTML = renderThinking(thinkingContent, true, msgIndex);
            container.scrollTop = container.scrollHeight;
          }
          
          if (delta.content) {
            if (!thinkingDone && thinkingContent) {
              thinkingDone = true;
              thinkingContainer.innerHTML = renderThinking(thinkingContent, false, msgIndex);
            }
            aiContent += delta.content;
            aiMsg.content = aiContent;
            bodyEl.innerHTML = marked.parse(aiContent);
            container.scrollTop = container.scrollHeight;
          }
        } catch (e) {}
      }
    }
    
    thinkingContainer.innerHTML = renderThinking(thinkingContent, false, msgIndex);
    bodyEl.innerHTML = marked.parse(aiContent);
    saveChats();
    
  } catch (err) {
    typingEl.remove();
    const errorEl = document.createElement('div');
    errorEl.className = 'error-banner';
    errorEl.innerHTML = '<strong>Fout:</strong> ' + escapeHtml(err.message) + '<br><br>Zorg dat dit bestand via een webserver wordt geserveerd (GitHub Pages, localhost), niet direct openen met file://';
    container.appendChild(errorEl);
    container.scrollTop = container.scrollHeight;
    if (conv.messages[conv.messages.length - 1]?.role === 'assistant') {
      conv.messages.pop();
      saveChats();
    }
  } finally {
    isStreaming = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// Init
if (Object.keys(conversations).length > 0) {
  currentId = Object.keys(conversations).sort().reverse()[0];
}
updateModeUI();
renderHistory();
renderMessages();
</script>
